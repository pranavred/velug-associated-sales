<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Plant intelligence</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url("/assets/manrope.woff2") format("woff2");
        font-weight: 200 800;
        font-display: swap;
      }
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --ink: #182c36;
        --muted: #556771;
        --line: #dce3e7;
        --accent: #08786e;
        --accent-soft: #e7f5f1;
        --tint: #f1f4f6;
        --amber: #805416;
        --amber-soft: #faf1df;
        --shadow: 0 8px 32px #142e3b08;
        --radius: 14px;
        color-scheme: light;
        font-family:
          Manrope,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-synthesis: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101b22;
          --panel: #17252d;
          --ink: #e5edf0;
          --muted: #a7bac4;
          --line: #31434c;
          --accent: #70d2bf;
          --accent-soft: #183d37;
          --tint: #21323b;
          --amber: #efc47c;
          --amber-soft: #3c3121;
          --shadow: none;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101b22;
        --panel: #17252d;
        --ink: #e5edf0;
        --muted: #a7bac4;
        --line: #31434c;
        --accent: #70d2bf;
        --accent-soft: #183d37;
        --tint: #21323b;
        --amber: #efc47c;
        --amber-soft: #3c3121;
        --shadow: none;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      summary,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a,
      summary {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 14px;
        background: var(--panel);
        color: var(--ink);
        font-weight: 650;
        font-size: 14px;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .primary {
        background: var(--accent);
        color: var(--panel);
        border-color: var(--accent);
      }
      .primary:hover {
        color: var(--panel);
        filter: brightness(0.95);
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        padding: 10px 12px;
        font-size: 16px;
      }
      input::placeholder {
        color: var(--muted);
      }
      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      a:hover {
        text-decoration: none;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 18px;
        letter-spacing: -0.6px;
        font-weight: 800;
      }
      h2 {
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -1px;
        font-weight: 750;
      }
      h3 {
        font-size: 18px;
        letter-spacing: -0.4px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      .topbar {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        background: var(--accent);
        color: var(--panel);
        border-radius: 9px;
        font-size: 18px;
        font-weight: 800;
      }
      .app-menu {
        position: relative;
        border: 0;
      }
      .app-menu > summary {
        list-style: none;
        cursor: pointer;
        min-width: 64px;
        min-height: 44px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
      }
      .app-menu > summary::-webkit-details-marker {
        display: none;
      }
      .menu-content {
        position: absolute;
        right: 0;
        top: 52px;
        z-index: 20;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        border-radius: 12px;
        padding: 8px;
        width: 200px;
      }
      .menu-content button,
      .menu-content a {
        display: block;
        width: 100%;
        text-align: left;
        min-height: 44px;
        padding: 10px 12px;
        border: 0;
        text-decoration: none;
        font-size: 14px;
      }
      .mode {
        display: none;
        font-size: 12px;
        color: var(--muted);
        font-weight: 650;
        margin-left: 4px;
      }
      .layout {
        max-width: 1600px;
        margin: auto;
      }
      .sidebar {
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }
      .sidebar-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .sidebar-heading h2 {
        font-size: 18px;
        letter-spacing: -0.5px;
      }
      .count {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        margin-left: 6px;
      }
      .search-field {
        display: block;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mobile-picker {
        display: block;
        margin-top: 12px;
      }
      #plant-nav {
        display: none;
      }
      #no-plants {
        padding: 16px 0;
        color: var(--muted);
      }
      .workspace {
        min-width: 0;
        padding: 24px 16px 48px;
      }
      .plant-header {
        margin-bottom: 28px;
      }
      .plant-header h2 {
        margin-bottom: 10px;
      }
      .address {
        color: var(--muted);
        max-width: 62ch;
        font-size: 14px;
        line-height: 1.6;
      }
      .plant-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
        padding: 5px 8px;
        font-weight: 600;
        color: var(--muted);
        background: var(--panel);
      }
      .chip.teal {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: transparent;
      }
      .chip.amber {
        background: var(--amber-soft);
        color: var(--amber);
        border-color: transparent;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 0 0 16px;
      }
      .section-heading h3 {
        font-size: 19px;
      }
      .score-help {
        position: relative;
      }
      .score-help > summary {
        font-size: 13px;
        cursor: pointer;
        color: var(--muted);
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .score-help[open] > p {
        position: absolute;
        right: 0;
        top: 44px;
        background: var(--panel);
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        width: min(300px, 80vw);
        z-index: 10;
        font-size: 14px;
      }
      .chemical-list {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .chemical-row + .chemical-row {
        border-top: 1px solid var(--line);
      }
      .chemical-summary {
        list-style: none;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px 12px;
        gap: 12px;
        align-items: center;
        padding: 20px;
        cursor: pointer;
        min-height: 90px;
      }
      .chemical-summary::-webkit-details-marker {
        display: none;
      }
      .chemical-summary::after {
        content: "+";
        color: var(--muted);
        font-size: 20px;
        font-weight: 400;
      }
      .chemical-row[open] > .chemical-summary::after {
        content: "−";
      }
      .chemical-summary:hover {
        background: var(--tint);
      }
      .chemical-name {
        font-weight: 750;
        font-size: 16px;
        line-height: 1.4;
        display: block;
      }
      .chemical-application {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-top: 5px;
      }
      .confidence {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .confidence-number {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -1px;
        line-height: 1;
      }
      .confidence-number small {
        font-size: 12px;
        letter-spacing: 0;
        font-weight: 500;
      }
      .confidence-track {
        height: 4px;
        margin-top: 9px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .confidence-track i {
        height: 100%;
        display: block;
        background: var(--accent);
        border-radius: 4px;
      }
      .chemical-content {
        padding: 0 20px 24px;
      }
      .conversation {
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
        padding: 18px;
        border-radius: 0 8px 8px 0;
      }
      .conversation p {
        font-size: 16px;
        line-height: 1.65;
        font-weight: 600;
        max-width: 64ch;
      }
      .conversation button {
        margin-top: 14px;
        background: var(--panel);
        font-size: 13px;
      }
      .lead-context {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 16px 0 12px;
      }
      .lead-reason {
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
        max-width: 72ch;
      }
      .lead-links {
        display: flex;
        gap: 8px 18px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .lead-links a {
        font-size: 13px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      .lead-details {
        border-top: 1px solid var(--line);
        margin-top: 14px;
      }
      .lead-details > summary {
        cursor: pointer;
        padding: 14px 0;
        font-size: 13px;
        font-weight: 650;
      }
      .score-factors {
        padding: 0;
        list-style: none;
        font-size: 13px;
      }
      .score-factors li {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .score-factors b {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .small-copy {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
      }
      .source-drawer {
        margin-top: 28px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      .source-drawer > summary {
        padding: 18px 20px;
        cursor: pointer;
        min-height: 60px;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        font-size: 14px;
      }
      .source-drawer > summary:after {
        content: "+";
        font-size: 20px;
        font-weight: 400;
      }
      .source-drawer[open] > summary:after {
        content: "−";
      }
      .drawer-content {
        padding: 0 20px 20px;
      }
      .claim {
        border-top: 1px solid var(--line);
      }
      .claim > summary {
        cursor: pointer;
        padding: 16px 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.65;
      }
      .claim p {
        font-size: 14px;
        margin: 12px 0;
        line-height: 1.7;
      }
      .claim blockquote {
        margin: 12px 0;
        padding: 14px 16px;
        border-left: 2px solid var(--line);
        font-size: 14px;
        color: var(--muted);
        line-height: 1.7;
      }
      .source-links {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .source-links a {
        font-size: 14px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      .review-form {
        padding: 16px 0;
      }
      .review-form summary {
        font-size: 14px;
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .review-fields {
        display: grid;
        gap: 12px;
        margin-top: 8px;
      }
      .source-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .source-list li {
        padding: 14px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
      }
      .source-list a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
      }
      .source-list p {
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .empty {
        padding: 32px 24px;
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .empty h3 {
        margin-bottom: 8px;
      }
      .empty p {
        color: var(--muted);
        max-width: 55ch;
        font-size: 14px;
      }
      .account-foot {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      #operations {
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 40px;
      }
      #operations > summary {
        cursor: pointer;
        min-height: 44px;
        font-size: 14px;
        color: var(--muted);
      }
      #operations h2 {
        font-size: 20px;
        margin: 24px 0 12px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 1.7;
        max-height: 360px;
        overflow: auto;
        background: var(--tint);
        padding: 16px;
        border-radius: 8px;
      }
      #changes article {
        border: 1px solid var(--line);
        padding: 18px;
        margin: 12px 0;
        border-radius: 8px;
      }
      .search-box {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }
      .search-hit {
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }
      .search-hit p {
        font-size: 14px;
        color: var(--muted);
        margin: 12px 0;
      }
      .app-error {
        padding: 20px;
        background: var(--amber-soft);
        color: var(--amber);
        border-radius: 8px;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        width: calc(100% - 32px);
        max-width: 500px;
        padding: 24px;
        background: var(--panel);
        color: var(--ink);
        box-shadow: 0 24px 80px #0003;
      }
      dialog::backdrop {
        background: #10253077;
        backdrop-filter: blur(3px);
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }
      .dialog-header h2 {
        font-size: 23px;
      }
      dialog form {
        display: grid;
        gap: 18px;
      }
      dialog label {
        font-size: 14px;
        display: grid;
        gap: 8px;
        font-weight: 600;
      }
      dialog p {
        margin-top: 16px;
        font-size: 14px;
        color: var(--muted);
      }
      #research-runs {
        margin-top: 20px;
      }
      #research-runs > details {
        border-top: 1px solid var(--line);
        font-size: 12px;
        padding: 12px 0;
      }
      #research-runs summary {
        cursor: pointer;
        min-height: 44px;
        font-weight: 650;
      }
      #research-runs button {
        font-size: 12px;
        margin: 8px 8px 0 0;
      }
      .flash {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 20px;
        background: var(--ink);
        color: var(--panel);
        border-radius: 10px;
        font-size: 14px;
        z-index: 40;
        box-shadow: var(--shadow);
      }
      @media (min-width: 800px) {
        .mode {
          display: inline;
        }
        .topbar {
          padding: 0 32px;
          height: 80px;
        }
        h1 {
          font-size: 20px;
        }
        .layout {
          display: grid;
          grid-template-columns: 264px minmax(0, 1fr);
          min-height: calc(100vh - 80px);
        }
        .sidebar {
          padding: 28px 20px;
          border-bottom: 0;
          border-right: 1px solid var(--line);
          background: var(--panel);
        }
        .workspace {
          padding: 36px 40px 56px;
          max-width: 1120px;
          width: 100%;
          margin: 0 auto;
        }
        .mobile-picker {
          display: block;
          display: none;
        }
        #plant-nav {
          display: grid;
          gap: 6px;
          margin-top: 20px;
        }
        .plant-option {
          text-align: left;
          padding: 14px;
          border: 1px solid transparent;
          background: transparent;
          border-radius: 10px;
          line-height: 1.45;
        }
        .plant-option strong {
          display: block;
          font-size: 14px;
          font-weight: 700;
        }
        .plant-option span {
          display: block;
          font-size: 12px;
          margin-top: 5px;
          color: var(--muted);
        }
        .plant-option[aria-current="true"] {
          background: var(--accent-soft);
          border-color: transparent;
          color: var(--accent);
        }
        .plant-option:hover {
          background: var(--tint);
        }
        h2 {
          font-size: 34px;
          letter-spacing: -1.3px;
        }
        .address {
          font-size: 14px;
        }
        .plant-header {
          margin-bottom: 36px;
        }
        .chemical-summary {
          padding: 22px 26px;
          grid-template-columns: minmax(0, 1fr) 100px 14px;
          gap: 24px;
        }
        .chemical-name {
          font-size: 17px;
        }
        .chemical-content {
          padding: 0 26px 26px;
        }
        .conversation {
          display: flex;
          align-items: center;
          gap: 24px;
          padding: 20px;
        }
        .conversation button {
          flex-shrink: 0;
          margin: 0;
        }
        .review-fields {
          grid-template-columns: 1fr 1fr;
        }
        .review-fields textarea {
          grid-column: 1/-1;
        }
        .account-foot {
          margin-top: 28px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button,
        a,
        summary {
          transition:
            background-color 0.14s,
            border-color 0.14s,
            color 0.14s;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
      .plant-overview {
        background: #142c2c;
        color: #edf5f3;
        border: 1px solid #284542;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 32px;
      }
      .plant-overview .plant-header {
        margin-bottom: 28px;
      }
      .plant-overview h2 {
        color: #edf5f3;
      }
      .plant-overview .address {
        color: #b8ccca;
      }
      .plant-overview .chip {
        background: #203c39;
        color: #c9e5df;
        border-color: #365752;
      }
      .plant-overview .chip.teal {
        background: #95e0cb;
        color: #113a31;
      }
      .plant-overview .chip.amber {
        background: #4e3d20;
        color: #f7d69c;
      }
      .overview-groups {
        display: grid;
        gap: 24px;
      }
      .overview-group h3 {
        font-size: 14px;
        line-height: 1.5;
        color: #b8ccca;
        font-weight: 500;
        margin: 0 0 10px;
      }
      .overview-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .overview-tag {
        max-width: 100%;
        border: 1px solid #46635e;
        border-radius: 6px;
        background: #203b37;
      }
      .overview-tag > summary {
        min-height: 44px;
        padding: 10px 12px;
        font-size: 15px;
        line-height: 1.5;
        list-style: none;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .overview-tag > summary::after {
        content: " +";
        color: #93d9c6;
      }
      .overview-tag[open] {
        width: 100%;
      }
      .overview-tag[open] > summary::after {
        content: " −";
      }
      .overview-tag[open] > summary {
        color: #a5ead6;
        border-bottom: 1px solid #46635e;
      }
      .overview-proof {
        padding: 4px 16px 16px;
        font-size: 15px;
        line-height: 1.7;
      }
      .overview-proof blockquote {
        margin: 12px 0;
        padding-left: 12px;
        border-left: 2px solid #86d6bf;
        color: #d6e6e1;
      }
      .overview-proof a {
        color: #a5ead6;
      }
      .overview-caveat,
      .overview-empty {
        color: #b8ccca;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
      .overview-group:last-child .overview-tag {
        background: transparent;
        border-color: #498f7e;
      }
      @media (min-width: 800px) {
        .plant-overview {
          padding: 32px;
        }
        .overview-groups {
          gap: 24px;
        }
      }
      @media (max-width: 400px) {
        .plant-overview {
          padding: 20px 16px;
        }
      }
      .plant-gallery {
        margin: 0 0 28px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #46635e;
        background: #0c1d1d;
      }
      .photo-frame {
        position: relative;
        max-width: 900px;
        margin: auto;
      }
      .photo-frame img {
        display: block;
        width: 100%;
        height: auto;
      }
      .photo-caption {
        padding: 14px 16px;
      }
      .photo-attribution {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        justify-content: space-between;
        font-size: 14px;
        color: #edf5f3;
      }
      .photo-caption a {
        color: #a5ead6;
      }
      .photo-note {
        margin-top: 6px;
        font-size: 12px;
        color: #b8ccca;
      }
      .photo-detail {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.65;
        color: #edf5f3;
      }
      .photo-marker {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #95e0cb;
        color: #113a31;
        border: 2px solid #fff;
        font-size: 17px;
        font-weight: 800;
        box-shadow: 0 2px 12px #0006;
        padding: 0;
      }
      .photo-marker[aria-expanded="true"] {
        background: #fff;
        color: #113a31;
      }
      .photo-nav,
      .photo-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .photo-nav {
        padding: 0 16px 16px;
      }
      .photo-legend {
        margin-top: 10px;
      }
      .photo-nav button,
      .photo-legend button {
        background: #203b37;
        border: 1px solid #46635e;
        color: #edf5f3;
        font-size: 13px;
      }
      .photo-nav button[aria-pressed="true"] {
        background: #95e0cb;
        color: #113a31;
        border-color: #95e0cb;
      }
      .photo-failure {
        padding: 24px;
        color: #edf5f3;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">P</span>
        <h1>Plant intelligence</h1>
        <span id="mode" class="mode"></span>
      </div>
      <details class="app-menu">
        <summary>Menu</summary>
        <div class="menu-content">
          <nav id="session-nav"></nav>
          <a href="/api/export">Export research JSON</a
          ><button onclick="refresh()">Refresh view</button
          ><button id="theme-toggle" onclick="toggleTheme()">
            Switch theme
          </button>
        </div>
      </details>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Plant navigation">
        <div class="sidebar-heading">
          <h2>Plants <span id="plant-count" class="count"></span></h2>
          <button
            id="new-plant"
            class="primary"
            hidden
            onclick="document.getElementById('research-dialog').showModal()"
          >
            New plant
          </button>
        </div>
        <label class="search-field"
          ><span class="sr-only">Find a plant</span
          ><input
            id="plant-filter"
            type="search"
            placeholder="Name or location"
            oninput="filterPlants()" /></label
        ><label class="mobile-picker"
          ><span class="sr-only">Select plant</span
          ><select
            id="plant-select"
            onchange="
              selectPlant(this.value);
              window.scrollTo({ top: 0, behavior: 'instant' });
            "
          ></select
        ></label>
        <nav id="plant-nav" aria-label="Plants"></nav>
        <p id="no-plants" hidden>No matching plants.</p>
        <div id="research-runs" aria-live="polite"></div>
      </aside>
      <div class="workspace">
        <div id="app-error" role="alert" hidden></div>
        <main id="plants" aria-label="Plant accounts"></main>
        <details id="operations">
          <summary>Operations</summary>
          <h2>Change review</h2>
          <div id="changes"></div>
          <h2>Scheduler</h2>
          <pre id="jobs"></pre>
          <h2>Run history</h2>
          <pre id="events"></pre>
        </details>
      </div>
    </div>
    <dialog id="research-dialog">
      <div class="dialog-header">
        <h2>Research a new plant</h2>
        <button
          aria-label="Close research form"
          onclick="document.getElementById('research-dialog').close()"
        >
          Close
        </button>
      </div>
      <form id="research-form">
        <label
          >Plant name<input
            name="name"
            required
            minlength="3"
            maxlength="160"
            placeholder="Company or facility" /></label
        ><label
          >Plant location<input
            name="location"
            required
            minlength="3"
            maxlength="240"
            placeholder="City and state, or street address" /></label
        ><button class="primary" type="submit">Research plant</button>
      </form>
      <p id="research-config"></p>
      <p id="research-message" role="status"></p>
    </dialog>
    <div id="toast" class="flash" role="status" hidden></div>
    <script>
      const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined && text !== null) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      };
      let state = null,
        selectedPlant = "",
        reviewToken = "",
        reviewRows = [],
        canReview = true,
        profileSignature = "",
        toastTimer;
      try {
        const t = localStorage.getItem("plant-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
      function toggleTheme() {
        const dark = document.documentElement.dataset.theme
          ? document.documentElement.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = dark ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        try {
          localStorage.setItem("plant-theme", theme);
        } catch {}
      }
      function toast(text) {
        const t = document.getElementById("toast");
        t.textContent = text;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.hidden = true), 3000);
      }
      function link(text, href) {
        const a = el("a", text);
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        return a;
      }
      function originalURL(sourceId, locator) {
        if (state.mode === "demo") return null;
        try {
          const u = new URL(state.sources.find((s) => s.id === sourceId)?.url);
          if (u.protocol !== "https:") return null;
          const page = locator?.match(/^PDF physical page (\d+)$/)?.[1];
          if (page) u.hash = "page=" + page;
          return u.href;
        } catch {
          return null;
        }
      }
      function savedURL(c) {
        return (
          "/evidence/" +
          encodeURIComponent(c.version) +
          "?locator=" +
          encodeURIComponent(c.locator) +
          "#selected"
        );
      }
      function proofLinks(c) {
        const box = el("div", null, "source-links");
        const original = originalURL(c.source_id, c.locator);
        if (original) box.append(link("Original source", original));
        box.append(link("Saved excerpt", savedURL(c)));
        return box;
      }
      function reviewForm(kind, target) {
        const box = el("div");
        const last = reviewRows.find(
          (r) => r.kind === kind && r.target === target,
        );
        if (last)
          box.append(
            el(
              "p",
              "Latest review: " +
                last.decision +
                " · " +
                last.reviewer +
                " · " +
                last.note,
              "small-copy",
            ),
          );
        if (!canReview) return box;
        const details = el("details", null, "review-form");
        details.append(el("summary", "Record a review"));
        const fields = el("div", null, "review-fields"),
          name = el("input"),
          note = el("textarea"),
          select = el("select");
        name.placeholder = "Reviewer name";
        name.setAttribute("aria-label", "Reviewer name");
        note.placeholder = "Evidence and reason";
        note.setAttribute("aria-label", "Review reason");
        select.setAttribute("aria-label", "Review decision");
        for (const choice of kind === "claim"
          ? ["supported", "unsupported", "uncertain"]
          : ["meaningful", "not_meaningful", "uncertain"]) {
          const option = el("option", choice.replaceAll("_", " "));
          option.value = choice;
          select.append(option);
        }
        select.value = "uncertain";
        const button = el("button", "Save review", "primary"),
          status = el("p");
        status.setAttribute("role", "status");
        button.onclick = async () => {
          button.disabled = true;
          try {
            const r = await fetch("/api/review", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Review-Token": reviewToken,
              },
              body: JSON.stringify({
                kind,
                target,
                decision: select.value,
                reviewer: name.value,
                note: note.value,
              }),
            });
            if (!r.ok) throw Error(await r.text());
            await refresh();
            toast("Review saved");
          } catch (e) {
            status.textContent = e.message;
          } finally {
            button.disabled = false;
          }
        };
        fields.append(name, select, note, button);
        details.append(fields, status);
        box.append(details);
        return box;
      }
      function drawer(title, cls = "") {
        const d = el("details", null, "source-drawer " + cls);
        d.append(el("summary", title));
        const inner = el("div", null, "drawer-content");
        d.append(inner);
        return { d, inner };
      }
      function renderChemical(lead, index) {
        const row = el("details", null, "chemical-row");
        row.dataset.chemicalId = lead.id;
        row.dataset.opportunityId = lead.opportunity_id;
        row.open = index === 0;
        const summary = el("summary", null, "chemical-summary"),
          title = el("span");
        title.append(
          el("span", lead.chemical_name, "chemical-name"),
          el("span", lead.application, "chemical-application"),
        );
        const score = el("span", null, "confidence");
        score.setAttribute(
          "aria-label",
          "Estimated use confidence " + lead.confidence.score + " out of 100",
        );
        const number = el(
          "span",
          String(lead.confidence.score),
          "confidence-number",
        );
        number.append(el("small", " / 100"));
        const track = el("span", null, "confidence-track");
        track.style.display = "block";
        const fill = el("i");
        fill.style.width = lead.confidence.score + "%";
        track.append(fill);
        score.append(number, track);
        summary.append(title, score);
        row.append(summary);
        const content = el("div", null, "chemical-content"),
          conversation = el("div", null, "conversation"),
          copy = el("button", "Copy question");
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(lead.question);
            toast("Question copied");
          } catch {
            toast("Select the question to copy it.");
          }
        };
        conversation.append(el("p", "“" + lead.question + "”"), copy);
        const context = el("div", null, "lead-context");
        context.append(
          el("span", lead.basis, "chip teal"),
          el("span", lead.confidence.label, "chip"),
        );
        content.append(
          conversation,
          context,
          el("p", lead.reason, "lead-reason"),
        );
        const links = el("div", null, "lead-links");
        const seen = new Set();
        for (const e of lead.evidence) {
          const original = originalURL(e.source_id, e.locator);
          if (original && !seen.has(original)) {
            links.append(
              link(
                e.locator.startsWith("PDF physical page ")
                  ? "Plant source · p. " +
                      e.locator.replace("PDF physical page ", "")
                  : "Plant source",
                original,
              ),
            );
            seen.add(original);
          }
        }
        for (const source of lead.industry_sources)
          if (!seen.has(source.url)) {
            links.append(
              link(
                source.url.includes("tetrapak")
                  ? "Tetra Pak handbook"
                  : source.url.includes("ecolab")
                    ? "Ecolab reference"
                    : source.url.includes("kurita")
                      ? "Kurita reference"
                      : "Industry reference",
                source.url,
              ),
            );
            seen.add(source.url);
          }
        content.append(links);
        const why = el("details", null, "lead-details");
        why.append(el("summary", "Why " + lead.confidence.score + " / 100?"));
        const factors = el("ul", null, "score-factors");
        for (const f of lead.confidence.factors) {
          const li = el("li");
          li.append(
            el("span", f.label),
            el("b", (f.points > 0 ? "+" : "") + f.points),
          );
          factors.append(li);
        }
        why.append(
          factors,
          el(
            "p",
            "Heuristic estimate for this chemical or family. Current use and purchasing intent are unverified.",
            "small-copy",
          ),
        );
        content.append(why);
        const qualification = el("details", null, "lead-details");
        qualification.append(el("summary", "Qualification & seller fit"));
        qualification.append(
          el("p", "Speak with: " + lead.roles.join(", "), "small-copy"),
          el(
            "p",
            "Rule out if: " + lead.disqualifiers.join("; "),
            "small-copy",
          ),
        );
        if (lead.seller) {
          qualification.append(
            el("p", "Brenntag · " + lead.seller.status, "small-copy"),
            el("p", lead.seller.qualification, "small-copy"),
          );
          if (lead.seller.source_url)
            qualification.append(
              link("Verify Brenntag public portfolio", lead.seller.source_url),
            );
        }
        for (const e of lead.evidence) qualification.append(proofLinks(e));
        content.append(qualification);
        row.append(content);
        return row;
      }
      function renderPlantPhoto(p) {
        const photos =
          state.mode === "demo"
            ? []
            : state.plant_media?.find((x) => x.plant_id === p.id)?.photos || [];
        if (!photos.length) return null;
        const gallery = el("figure", null, "plant-gallery");
        const stage = el("div", null, "photo-stage");
        const caption = el("figcaption", null, "photo-caption");
        const nav = el("div", null, "photo-nav");
        const buttons = [];
        function show(index) {
          const photo = photos[index];
          stage.replaceChildren();
          caption.replaceChildren();
          const frame = el("div", null, "photo-frame"),
            img = el("img");
          img.src = "/assets/plants/" + photo.file;
          img.alt = photo.alt;
          img.decoding = "async";
          img.onerror = () => {
            frame.replaceChildren(
              el(
                "p",
                "Photo unavailable. Open the source below.",
                "photo-failure",
              ),
            );
          };
          frame.append(img);
          stage.append(frame);
          const detail = el("p", null, "photo-detail");
          detail.hidden = true;
          detail.setAttribute("aria-live", "polite");
          photo.markers.forEach((marker, i) => {
            const button = el("button", String(i + 1), "photo-marker");
            button.type = "button";
            button.style.left = marker.x + "%";
            button.style.top = marker.y + "%";
            button.setAttribute("aria-label", marker.label);
            button.setAttribute("aria-expanded", "false");
            button.title = marker.label;
            button.onclick = () => {
              frame
                .querySelectorAll("button")
                .forEach((b) => b.setAttribute("aria-expanded", "false"));
              button.setAttribute("aria-expanded", "true");
              detail.textContent = marker.label + " — " + marker.detail;
              detail.hidden = false;
            };
            frame.append(button);
          });
          const attribution = el("div", null, "photo-attribution");
          attribution.append(
            el("span", photo.title),
            link(photo.credit + " ↗", photo.source),
          );
          caption.append(
            attribution,
            el("p", photo.note, "photo-note"),
            detail,
          );
          if (photo.markers.length) {
            const legend = el("div", null, "photo-legend");
            photo.markers.forEach((m, i) => {
              const b = el("button", i + 1 + " · " + m.label);
              b.type = "button";
              b.onclick = () => frame.querySelectorAll("button")[i].click();
              legend.append(b);
            });
            caption.append(legend);
          }
          buttons.forEach((b, i) =>
            b.setAttribute("aria-pressed", String(i === index)),
          );
        }
        photos.forEach((photo, i) => {
          const b = el("button", photo.title);
          b.type = "button";
          b.onclick = () => show(i);
          buttons.push(b);
          nav.append(b);
        });
        gallery.append(stage, caption);
        if (photos.length > 1) gallery.append(nav);
        show(0);
        return gallery;
      }
      function renderOverview(p, header) {
        const overview = el("section", null, "plant-overview");
        overview.setAttribute("aria-label", "Plant overview");
        const photo = renderPlantPhoto(p);
        if (photo) overview.append(photo);
        overview.append(header);
        const sections =
          state.plant_overviews?.find((x) => x.plant_id === p.id)?.sections ||
          {};
        const groups = el("div", null, "overview-groups");
        for (const [key, title] of [
          ["products", "What they make"],
          ["equipment", "Equipment & utilities"],
          ["permits", "Permits"],
          ["changes", "What’s changing"],
        ]) {
          const section = el("section", null, "overview-group");
          section.append(el("h3", title));
          const items = sections[key] || [];
          if (!items.length)
            section.append(
              el(
                "p",
                key === "changes"
                  ? "No sourced change in this research."
                  : "Not established in this research.",
                "overview-empty",
              ),
            );
          const tags = el("div", null, "overview-tags");
          for (const item of items) {
            const tag = el("details", null, "overview-tag");
            tag.append(el("summary", item.label));
            const detail = el("div", null, "overview-proof");
            detail.append(
              el("p", item.statement),
              el("blockquote", item.quote),
              el("p", item.temporal_scope, "overview-caveat"),
            );
            if (item.site_match === "locality_only")
              detail.append(
                el(
                  "p",
                  "Locality match · confirm the facility",
                  "overview-caveat",
                ),
              );
            if (item.stale)
              detail.append(
                el(
                  "p",
                  "Source changed since extraction · recheck",
                  "overview-caveat",
                ),
              );
            detail.append(proofLinks(item));
            tag.append(detail);
            tags.append(tag);
          }
          section.append(tags);
          groups.append(section);
        }
        overview.append(groups);
        return overview;
      }
      function renderPlant(p) {
        const card = el("article");
        card.dataset.plantId = p.id;
        const row = state.profiles.find((x) => x.plant === p.id),
          profile = row?.profile,
          leads = (state.chemical_leads || []).filter(
            (c) => c.plant_id === p.id,
          ),
          hold =
            p.hold || profile?.prospect_status === "suppressed_pending_review";
        const header = el("div", null, "plant-header");
        header.append(el("h2", p.name), el("p", p.address, "address"));
        const meta = el("div", null, "plant-meta");
        meta.append(
          el(
            "span",
            hold ? "Account on hold" : leads.length + " chemical leads",
            "chip " + (hold ? "amber" : "teal"),
          ),
          el(
            "span",
            state.sources.filter((s) => s.plant === p.id && s.version).length +
              " sources",
            "chip",
          ),
        );
        if (state.mode === "demo")
          meta.append(el("span", "Synthetic evidence", "chip amber"));
        header.append(meta);
        card.append(renderOverview(p, header));
        const heading = el("div", null, "section-heading");
        heading.append(el("h3", "Chemicals to discuss"));
        const help = el("details", null, "score-help");
        help.append(
          el("summary", "Estimated use ⓘ"),
          el(
            "p",
            state.confidence_model?.explanation ||
              "A heuristic score, not a probability or proof of chemical use.",
          ),
        );
        heading.append(help);
        card.append(heading);
        if (leads.length) {
          const list = el("div", null, "chemical-list");
          leads.forEach((lead, i) => list.append(renderChemical(lead, i)));
          card.append(list);
        } else {
          const empty = el("div", null, "empty");
          empty.append(
            el(
              "h3",
              hold
                ? "Confirm plant status first"
                : state.mode === "demo"
                  ? "Workflow practice"
                  : "Research in progress",
            ),
            el(
              "p",
              hold
                ? "A closure-related signal puts this account on hold. Review the source before starting a sales conversation."
                : state.mode === "demo"
                  ? "Use the synthetic evidence below to practice reviewing a finding."
                  : "Chemical leads will appear when the research supports an application. Check the research status or explore the source evidence.",
            ),
          );
          card.append(empty);
        }
        const research = drawer(
          "Plant research · " + (profile?.claims.length || 0) + " findings",
          "research-drawer",
        );
        if (profile) {
          research.inner.append(
            el(
              "p",
              profile.mode === "codex_assisted_review"
                ? "Codex-reviewed · Claude not run"
                : profile.mode === "live_model"
                  ? "Claude research · Review pending"
                  : "Synthetic fixture · No model calls",
              "small-copy",
            ),
          );
          research.inner.append(el("p", p.risk, "small-copy"));
          for (const c of profile.claims) {
            const b = el("details", null, "claim");
            b.dataset.claimId = c.id;
            b.append(
              el("summary", c.statement),
              el("p", c.temporal_scope),
              el("blockquote", c.quote),
              el(
                "p",
                c.locator + " · " + c.site_match.replaceAll("_", " "),
                "small-copy",
              ),
              proofLinks(c),
              reviewForm("claim", row.id + ":" + c.id),
            );
            research.inner.append(b);
          }
          const coverage = el("details", null, "claim");
          coverage.append(
            el("summary", "Hypotheses, unknowns & coverage"),
            el(
              "pre",
              JSON.stringify(
                {
                  hypotheses: profile.hypotheses,
                  unknowns: profile.unknowns,
                  coverage: profile.coverage,
                  rejected: profile.rejected,
                },
                null,
                2,
              ),
            ),
          );
          research.inner.append(coverage);
        } else
          research.inner.append(
            el("p", "No profile collected yet.", "small-copy"),
          );
        card.append(research.d);
        const sources = drawer("Sources & retrieval status", "sources-drawer"),
          list = el("ul", null, "source-list");
        for (const s of state.sources.filter((s) => s.plant === p.id)) {
          const li = el("li");
          try {
            if (new URL(s.url).protocol === "https:")
              li.append(link(s.title, s.url));
          } catch {}
          li.append(
            el("p", s.error || (s.version ? "Snapshot saved" : "No snapshot")),
            el(
              "p",
              (s.approved ? "Approved source" : "Discovery candidate") +
                " · Checked " +
                (s.last_checked
                  ? new Date(s.last_checked).toLocaleDateString()
                  : "never"),
            ),
          );
          list.append(li);
        }
        sources.inner.append(list);
        card.append(sources.d);
        const foot = el("div", null, "account-foot");
        foot.append(
          el("span", p.id),
          el("span", "Chemicals & families · Estimated use"),
        );
        card.append(foot);
        return card;
      }
      function selectPlant(id) {
        selectedPlant = id;
        for (const card of document.querySelectorAll("#plants > article"))
          card.hidden = card.dataset.plantId !== id;
        for (const b of document.querySelectorAll("[data-select-plant]"))
          b.setAttribute("aria-current", String(b.dataset.selectPlant === id));
        document.getElementById("plant-select").value = id;
        try {
          sessionStorage.setItem("selected-plant", id);
        } catch {}
      }
      function filterPlants() {
        if (!state) return;
        const q = document
            .getElementById("plant-filter")
            .value.toLowerCase()
            .trim(),
          matches = state.plants.filter((p) =>
            (p.name + " " + p.address).toLowerCase().includes(q),
          );
        const nav = document.getElementById("plant-nav"),
          select = document.getElementById("plant-select");
        nav.replaceChildren();
        select.replaceChildren();
        for (const p of matches) {
          const b = el("button", null, "plant-option");
          b.dataset.selectPlant = p.id;
          b.append(
            el("strong", p.name.split(" · ")[0]),
            el("span", p.name.split(" · ")[1] || p.address),
          );
          b.onclick = () => {
            selectPlant(p.id);
            window.scrollTo({ top: 0, behavior: "instant" });
          };
          nav.append(b);
          const option = el("option", p.name);
          option.value = p.id;
          select.append(option);
        }
        document.getElementById("no-plants").hidden = !!matches.length;
        select.hidden = !matches.length;
        if (!matches.some((p) => p.id === selectedPlant))
          selectedPlant = matches[0]?.id || "";
        selectPlant(selectedPlant);
      }
      function renderOperations() {
        const changes = document.getElementById("changes");
        changes.replaceChildren();
        if (!state.changes.length)
          changes.append(el("p", "No recorded changes.", "small-copy"));
        for (const c of state.changes) {
          const box = el("article");
          box.append(el("h3", c.source), el("p", c.note, "small-copy"));
          const links = el("div", null, "source-links");
          for (const [label, id] of [
            ["Before", c.before_version],
            ["After", c.after_version],
          ])
            links.append(link(label + " saved evidence", "/evidence/" + id));
          box.append(links);
          for (const delta of c.diff) {
            const d = el("details");
            d.append(
              el("summary", delta.kind + " · " + delta.locator),
              el(
                "pre",
                "BEFORE\n" +
                  (delta.before || "(absent)") +
                  "\n\nAFTER\n" +
                  (delta.after || "(absent)"),
              ),
            );
            box.append(d);
          }
          box.append(reviewForm("change", String(c.id)));
          changes.append(box);
        }
        document.getElementById("jobs").textContent =
          "Daily API attempts: " +
          JSON.stringify(state.budgets) +
          "\n" +
          state.jobs
            .map(
              (j) =>
                j.id +
                " · " +
                j.status +
                " · next " +
                new Date(j.next_at).toISOString() +
                (j.error ? " · " + j.error : ""),
            )
            .join("\n");
        document.getElementById("events").textContent = state.events
          .map((e) => e.at + " · " + e.kind + " · " + e.detail)
          .join("\n");
      }
      function renderResearch(d) {
        profileSignature = d.profiles.map((p) => p.id).join(",");
        document.getElementById("new-plant").hidden = !d.research;
        document.getElementById("research-config").textContent =
          d.research && !d.research.enabled
            ? "Claude key not configured. Requests will wait."
            : "";
        const container = document.getElementById("research-runs");
        const openIds = new Set(
          [...container.querySelectorAll("details[open]")].map(
            (n) => n.dataset.runId,
          ),
        );
        container.replaceChildren();
        const statuses = {
          awaiting_key: "Waiting for Claude key",
          queued: "Queued",
          discovering: "Finding sources",
          collecting: "Collecting documents",
          synthesizing: "Validating claims",
          complete: "Ready for review",
          failed: "Research failed",
        };
        for (const r of d.research?.requests || []) {
          const item = el("details");
          item.dataset.runId = r.id;
          item.open = openIds.has(r.id);
          item.append(
            el("summary", r.name + " · " + (statuses[r.status] || r.status)),
          );
          if (r.error) item.append(el("p", r.error, "small-copy"));
          const view = el("button", "View plant");
          view.onclick = () => {
            document.getElementById("plant-filter").value = "";
            filterPlants();
            selectPlant(r.plant);
          };
          item.append(view);
          if (["complete", "failed"].includes(r.status)) {
            const retry = el("button", "Research again");
            retry.onclick = () =>
              submitResearch({ name: r.name, location: r.location });
            item.append(retry);
          }
          container.append(item);
        }
      }
      async function submitResearch(value) {
        const button = document.querySelector("#research-form button"),
          message = document.getElementById("research-message");
        button.disabled = true;
        try {
          const r = await fetch("/api/research", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(value),
          });
          if (r.redirected) {
            location.href = "/login";
            return;
          }
          const data = await r.json();
          if (!r.ok) throw Error(data.error || "Research request failed");
          message.textContent =
            data.request.status === "awaiting_key"
              ? "Saved. Research will start after the Claude key is configured."
              : "Research requested.";
          await refresh();
          selectedPlant = data.request.plant;
          document.getElementById("plant-filter").value = "";
          filterPlants();
        } catch (e) {
          message.textContent = e.message;
        } finally {
          button.disabled = false;
        }
      }
      document.getElementById("research-form").onsubmit = (e) => {
        e.preventDefault();
        const data = new FormData(e.currentTarget);
        submitResearch({
          name: data.get("name"),
          location: data.get("location"),
        });
      };
      function addSearch() {
        const d = drawer("Search saved evidence", "evidence-search");
        d.d.id = "evidence-search";
        const form = el("form", null, "search-box"),
          input = el("input");
        input.id = "search";
        input.placeholder = "Search documents";
        input.setAttribute("aria-label", "Search saved evidence");
        const button = el("button", "Search evidence");
        button.type = "submit";
        form.onsubmit = (e) => {
          e.preventDefault();
          searchEvidence();
        };
        form.append(input, button);
        d.inner.append(form, el("div"));
        d.inner.lastChild.id = "search-results";
        document.getElementById("operations").before(d.d);
      }
      async function searchEvidence() {
        const r = await (
          await fetch(
            "/api/search?q=" +
              encodeURIComponent(document.getElementById("search").value),
          )
        ).json();
        const results = document.getElementById("search-results");
        results.replaceChildren();
        if (!r.hits.length)
          results.append(el("p", "No matching passages in collected sources."));
        for (const hit of r.hits) {
          const item = el("article", null, "search-hit");
          item.append(
            link(
              hit.title + " · " + hit.locator,
              originalURL(hit.source_id, hit.locator) || hit.href + "#selected",
            ),
            el("p", hit.excerpt),
            link("Saved excerpt", hit.href + "#selected"),
          );
          results.append(item);
        }
      }
      async function refresh() {
        const error = document.getElementById("app-error");
        try {
          const response = await fetch("/api/state");
          if (response.redirected) {
            location.href = "/login";
            return;
          }
          if (!response.ok)
            throw Error("Research could not be loaded. Try refreshing.");
          const d = await response.json();
          const opened = new Set(
            [...document.querySelectorAll("#plants details[open]")].map(
              (n) => n.dataset.chemicalId || n.dataset.claimId || n.className,
            ),
          );
          state = d;
          reviewRows = d.reviews;
          reviewToken = d.review_token;
          canReview = d.can_review !== false;
          document.getElementById("mode").textContent =
            d.mode === "demo" ? "Synthetic demo" : "";
          document.getElementById("plant-count").textContent = d.plants.length;
          const grid = document.getElementById("plants");
          grid.replaceChildren(...d.plants.map(renderPlant));
          for (const n of grid.querySelectorAll("details"))
            if (
              opened.has(
                n.dataset.chemicalId || n.dataset.claimId || n.className,
              )
            )
              n.open = true;
          if (!selectedPlant) {
            try {
              selectedPlant = sessionStorage.getItem("selected-plant") || "";
            } catch {}
          }
          filterPlants();
          renderOperations();
          renderResearch(d);
          error.hidden = true;
        } catch (e) {
          error.className = "app-error";
          error.textContent = e.message;
          error.hidden = false;
        }
      }
      addSearch();
      refresh();
      setInterval(async () => {
        if (
          document.hidden ||
          document.querySelector("input:focus,textarea:focus,select:focus")
        )
          return;
        try {
          const response = await fetch("/api/state");
          if (response.redirected) return;
          const d = await response.json();
          if (d.profiles.map((p) => p.id).join(",") !== profileSignature)
            await refresh();
          else renderResearch(d);
        } catch {}
      }, 15000);
    </script>
  </body>
</html>
